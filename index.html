<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mes Recettes</title>
<style>:root{--bg:#f7f5f2;--card:#ffffff;--primary:#ff6b4a;--primary-dark:#e5532f;--text:#2b2b2b;--muted:#8a8a8a;--border:#eae6e1;--green:#2e9e5b}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:100px;padding-bottom:calc(100px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:10;background:var(--primary);color:white;padding:16px 16px 12px;padding-top:calc(16px + env(safe-area-inset-top))}header h1{font-size:22px;font-weight:700}.tabs{display:flex;gap:8px;margin-top:12px}.tab{flex:1;border:none;background:rgba(255,255,255,.2);color:white;padding:10px;border-radius:12px;font-size:15px;font-weight:600}.tab.active{background:white;color:var(--primary-dark)}main{padding:16px;max-width:640px;margin:0 auto}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:8px 2px 10px;font-weight:700}.recipe-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;}.recipe-card.selected{border-color:var(--primary);background:#fff4f0}.recipe-thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;background:#fff4f0}
.recipe-thumb img{width:100%;height:100%;object-fit:cover}.recipe-info{flex:1}.recipe-name{font-weight:700;font-size:16px}.recipe-meta{font-size:13px;color:var(--muted);margin-top:3px}.check{width:26px;height:26px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center}.recipe-card.selected .check{background:var(--primary);border-color:var(--primary);color:white}.ing-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}.ing-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex-shrink:0}.ing-name{font-size:15px}.ing-qty{font-size:13px;color:var(--muted)}.ing-row.checked .ing-name{text-decoration:line-through;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}.btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}.btn-primary{background:var(--primary);color:white}.btn-primary:disabled{background:#ddd;color:#999}.btn-secondary{background:#f0ece8;color:var(--text)}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal-bg.open{display:flex}.modal{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}.modal h2{font-size:18px;margin-bottom:14px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;background:var(--bg)}.field textarea{height:90px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:4px}.modal-actions{display:flex;gap:10px;margin-top:16px}.hidden{display:none}.view-btn{border:1px solid var(--border);border-radius:10px;padding:4px 7px;font-size:13px;background:#fff;cursor:pointer}
.servings-badge{border:1px solid var(--border);border-radius:10px;padding:4px 8px;font-size:11px;font-weight:700;background:#fff;cursor:pointer;white-space:nowrap}
.delete-recipe{border:none;background:none;color:#d33;font-size:20px;padding:4px 8px;cursor:pointer}.search-results{margin-top:6px}.result-card{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}.result-card img{width:52px;height:52px;border-radius:10px;object-fit:cover}.result-name{font-weight:600;font-size:15px}.result-meta{font-size:12px;color:var(--muted)}.detail-hero{width:100%;height:200px;object-fit:cover;border-radius:14px;margin-bottom:12px}
.detail-hero-placeholder{width:100%;height:200px;border-radius:14px;margin-bottom:12px;background:#fff4f0;display:flex;align-items:center;justify-content:center;font-size:60px}
.detail-ing{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.detail-ing img{width:36px;height:36px;border-radius:50%;background:#f7f5f2;object-fit:cover;flex-shrink:0}
.detail-ing .di-ph{width:36px;height:36px;border-radius:50%;background:#fff4f0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.detail-instructions{font-size:14px;line-height:1.6;color:var(--text);white-space:pre-line;margin-top:10px}
.big-step{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:22px;font-weight:700;cursor:pointer}
.servings{display:flex;align-items:center;gap:6px;font-size:12px}.servings button{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0}.servings span{color:var(--muted);white-space:nowrap}.type-choice{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:14px 8px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:15px;font-weight:600;color:var(--text);cursor:pointer;margin-bottom:8px}
.type-choice:active{background:#fff4f0;border-color:var(--primary)}
.tc-emoji{font-size:30px}
#typeChoices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.back-btn{border:none;background:none;color:var(--muted);font-size:13px;padding:6px 0;cursor:pointer;width:100%}
.chip-row{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--border);border-radius:16px;padding:6px 12px;font-size:12px;background:var(--card);white-space:nowrap;cursor:pointer;flex-shrink:0}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}.area-choice{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:15px;font-weight:600;color:var(--text);cursor:pointer;margin-bottom:8px}
.area-choice:active{background:#fff4f0;border-color:var(--primary)}
.area-choice .ar-emoji{font-size:22px}
.area-choice .ar-sub{font-size:11px;color:var(--muted);font-weight:400}.store-choice{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:15px;font-weight:600;color:var(--text);cursor:pointer;margin-bottom:8px;text-align:left}
.store-choice:active{background:#fff4f0;border-color:var(--primary)}
.store-choice .st-emoji{font-size:22px}
.store-choice .st-price{font-weight:800;font-size:15px;color:var(--primary-dark);white-space:nowrap}
.store-choice .st-sub{font-size:11px;color:var(--muted);font-weight:400}
.price-total{background:#fff4f0;border:1px solid var(--primary);border-radius:14px;padding:14px;margin:10px 0;text-align:center}
.price-total .pt-amount{font-size:28px;font-weight:800;color:var(--primary-dark)}
.price-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 2px}
.price-row .pr-name{flex:1}
.price-row .pr-val{font-weight:600;color:var(--text)}.result-hint{font-size:12px;color:var(--muted);margin:4px 2px}.loading{text-align:center;color:var(--muted);padding:14px;font-size:14px}</style>
</head>
<body>
<header>
<h1>🍽️ Mes Recettes</h1>
<div class="tabs">
<button class="tab active" id="tabRecipes" onclick="showTab('recipes')">Recettes</button>
<button class="tab" id="tabList" onclick="showTab('list')">Ma liste 🛒</button>
</div>
</header>
<main id="viewRecipes">
<div class="section-title">Mes recettes</div>
<div id="recipeList"></div>
<button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="openModal()">➕ Ajouter</button>
</main>
<main id="viewList" class="hidden">
<div class="section-title">À acheter</div>
<div id="ingredientList"></div>
<button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="clearChecked()">Décocher tout</button>
<button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="openPriceModal()">💰 Estimer le prix du panier</button>
</main>
<div class="modal-bg" id="detailModalBg" onclick="if(event.target===this)closeDetail()">
<div class="modal">
<div id="detailContent"></div>
</div>
</div>
<div class="modal-bg" id="servingsModalBg" onclick="if(event.target===this)closeServingsEditor()">
<div class="modal" style="max-width:400px">
<h2 id="servingsEditorTitle">Pour combien de personnes ?</h2>
<div class="field">
<div class="servings" style="justify-content:center;gap:14px">
<button type="button" class="big-step" onclick="stepServings(-1)">−</button>
<span id="editorServingsVal" style="font-size:24px;font-weight:800">4</span>
<button type="button" class="big-step" onclick="stepServings(1)">+</button>
</div>
<div class="hint" style="text-align:center">personne(s)</div>
</div>
<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeServingsEditor()">Annuler</button>
<button class="btn btn-primary" onclick="applyServings()">Valider</button>
</div>
</div>
</div>
<div class="modal-bg" id="priceModalBg" onclick="if(event.target===this)closePriceModal()">
<div class="modal">
<h2>💰 Estimation du panier</h2>
<div id="priceStoreChoice">
<div class="section-title" style="margin-top:0">Où fais-tu tes courses ?</div>
<div id="storeChoices"></div>
</div>
<div id="priceResult" style="display:none"></div>
</div>
</div>
<footer>
<button class="btn btn-secondary" id="btnClear" onclick="clearSelection()">Tout retirer</button>
<button class="btn btn-primary" id="btnGenerate" onclick="showTab('list')" disabled>🛒 Voir ma liste</button>
</footer>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
<div class="modal">
<h2 id="modalTitle">Ajouter</h2>
<div id="step1">
<div class="section-title" style="margin-top:0">Quoi ?</div>
<div id="typeChoices">
<button type="button" class="type-choice" onclick="chooseType('Apero')"><span class="tc-emoji">🥂</span>Apéro</button>
<button type="button" class="type-choice" onclick="chooseType('Starter')"><span class="tc-emoji">🥗</span>Entrée</button>
<button type="button" class="type-choice" onclick="chooseType('Main')"><span class="tc-emoji">🍽️</span>Plat</button>
<button type="button" class="type-choice" onclick="chooseType('Dessert')"><span class="tc-emoji">🍰</span>Dessert</button>
</div>
</div>
<div id="step2" style="display:none">
<div class="section-title" style="margin-top:0">Quelle cuisine ?</div>
<div id="areaChoices"></div>
<button type="button" class="back-btn" onclick="backToType()">← Changer de type</button>
</div>
<div id="step3" style="display:none">
<div class="field" style="margin-bottom:6px">
<label>Chercher une recette</label>
<input id="fSearch" placeholder="carbonara, tarte, poulet..." autocomplete="off" oninput="onSearchInput()">
</div>
<div id="searchResults" class="search-results"></div>
<div id="manualFields" style="display:none">
<div class="field">
<label>Nom de la recette</label>
<input id="fName" placeholder="Ex : Poulet au citron">
</div>
<div class="field">
<label>Ingrédients (modifiables)</label>
<textarea id="fIngredients" placeholder="Ou saisis-les à la main"></textarea>
<div class="hint">Ex : 200 g de farine, 2 œufs</div>
</div>
</div>
<button type="button" class="back-btn" onclick="backToStep2()">← Changer de cuisine</button>
</div>
<div class="field" id="servingsField" style="display:none">
<label>Pour combien de personnes ?</label>
<div class="servings">
<button type="button" onclick="adjustServings(-1)">−</button>
<span id="servingsVal">2</span> personne(s)
<button type="button" onclick="adjustServings(1)">+</button>
<span id="servingsHint">(recette de base : <span id="servingsBase">4</span>)</span>
</div>
</div>
<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
<button class="btn btn-primary" onclick="saveRecipe()">Enregistrer</button>
</div>
</div>
</div>
<script>const DEFAULT_RECIPES = [];
function loadJson(key, fallback) {
try {
const v = JSON.parse(localStorage.getItem(key) || "null");
return v === null ? fallback : v;
} catch (e) {
return fallback;
}
}
function validRecipes(v) {
if (!Array.isArray(v)) return DEFAULT_RECIPES.slice();
return v.filter(r => r && typeof r.id === "string" && typeof r.name === "string" && Array.isArray(r.ingredients))
.map(r => ({ id: String(r.id).slice(0, 64), name: String(r.name).slice(0, 120), emoji: typeof r.emoji === "string" ? r.emoji.slice(0, 8) : "", ingredients: r.ingredients.map(i => String(i).slice(0, 120)), servings: typeof r.servings === "number" ? Math.max(1, Math.min(12, r.servings)) : 4, type: typeof r.type === "string" ? r.type.slice(0, 16) : null, image: typeof r.image === "string" ? r.image.slice(0, 500) : "", instructions: typeof r.instructions === "string" ? r.instructions.slice(0, 4000) : "" }));
}
function validStrArray(v) {
return Array.isArray(v) ? v.filter(x => typeof x === "string").map(x => x.slice(0, 256)) : [];
}
let recipes = validRecipes(loadJson("recipes", null));
let selection = validStrArray(loadJson("selection", []));
let checkedItems = validStrArray(loadJson("checkedItems", []));
let editId = null;
let baseServings = 4;
let currentServings = 2;
function adjustServings(d) {
currentServings = Math.max(1, Math.min(12, currentServings + d));
document.getElementById("servingsVal").textContent = currentServings;
scaleIngredientsToServings();
}
function scaleIngredientsToServings() {
const m = window._pickedMeal;
if (!m) return;
document.getElementById("fIngredients").value = mealToIngredients(m, currentServings / baseServings).join("\n");
}
function save() {
localStorage.setItem("recipes", JSON.stringify(recipes));
localStorage.setItem("selection", JSON.stringify(selection));
localStorage.setItem("checkedItems", JSON.stringify(checkedItems));
}
function showTab(tab) {
document.getElementById("viewRecipes").classList.toggle("hidden", tab !== "recipes");
document.getElementById("viewList").classList.toggle("hidden", tab !== "list");
document.getElementById("tabRecipes").classList.toggle("active", tab === "recipes");
document.getElementById("tabList").classList.toggle("active", tab === "list");
document.getElementById("btnGenerate").disabled = selection.length === 0;
if (tab === "list") renderIngredients();
window.scrollTo(0, 0);
}
function toggleRecipe(id) {
const i = selection.indexOf(id);
if (i === -1) selection.push(id); else selection.splice(i, 1);
save();
renderRecipes();
}
function renderRecipes() {
const el = document.getElementById("recipeList");
el.innerHTML = recipes.map(r => {
const sel = selection.includes(r.id);
return `<div class="recipe-card ${sel ? "selected" : ""}" onclick="toggleRecipe('${safeId(r.id)}')">
<div class="recipe-thumb">${r.image ? `<img src="${safeImgUrl(r.image)}" alt="" loading="lazy">` : (escapeHtml(r.emoji || "🍽️"))}</div>
<div class="recipe-info">
<div class="recipe-name">${escapeHtml(r.name)}</div>
<div class="recipe-meta">${r.ingredients.length} ingrédients${r.type ? " · " + escapeHtml(TYPE_LABELS[r.type] || r.type) : ""}</div>
</div>
<div style="display:flex;align-items:center;gap:6px">
<button class="view-btn" onclick="event.stopPropagation();openDetail('${safeId(r.id)}')" title="Voir la recette">👁️</button>
<button class="servings-badge" onclick="event.stopPropagation();openServingsEditor('${safeId(r.id)}')">👥 ${r.servings || 4}p</button>
<button class="delete-recipe" onclick="event.stopPropagation();deleteRecipe('${safeId(r.id)}')">🗑️</button>
<div class="check">${sel ? "✓" : ""}</div>
</div>
</div>`;
}).join("") || `<div class="empty">Aucune recette pour l'instant.</div>`;
document.getElementById("btnGenerate").disabled = selection.length === 0;
document.getElementById("btnGenerate").textContent = selection.length === 0
? "🛒 Voir ma liste"
: `🛒 Ma liste (${selection.length})`;
}
function deleteRecipe(id) {
const r = recipes.find(x => x.id === id);
if (!confirm(`Supprimer ?`)) return;
recipes = recipes.filter(x => x.id !== id);
selection = selection.filter(x => x !== id);
save();
renderRecipes();
}
const GRAMS = { g: 1, gr: 1, gramme: 1, grammes: 1, kg: 1000, kilo: 1000, kilos: 1000 };
const LITERS = { l: 1, litre: 1, litres: 1, litre: 1, ml: 0.001, cl: 0.01, dl: 0.1 };
function parseIngredient(line) {
const m = line.trim().match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|gr|grammes?|gramme|l|litres?|litre|ml|cl|dl|kilo|kilos)\s+(.+)$/i);
if (!m) return { name: line.trim(), qty: null };
let val = parseFloat(m[1].replace(",", "."));
const unitRaw = m[2].toLowerCase();
let unit = unitRaw.startsWith("k") && unitRaw !== "kilo" && unitRaw !== "kilos" ? "g" : (unitRaw === "kilo" || unitRaw === "kilos" ? "g" : (GRAMS[unitRaw] ? "g" : "l"));
if (unit === "g") val = val * GRAMS[unitRaw];
else if (unit === "l") val = val * LITERS[unitRaw];
const cleanName = m[3].trim().replace(/^(de\s+|du\s+|des\s+|d')/i, "");
return { name: cleanName, qty: val, unit, raw: `${m[1]} ${m[2]}` };
}
function formatQty(total, unit) {
if (unit === "g") {
if (total >= 1000) return (Math.round(total / 100) / 10) + " kg";
return Math.round(total) + " g";
}
if (unit === "l") {
if (total >= 1) return (Math.round(total * 10) / 10) + " L";
return Math.round(total * 1000) + " ml";
}
return total;
}
function buildAggregated() {
const map = {};
for (const id of selection) {
const r = recipes.find(x => x.id === id);
if (!r) continue;
for (const line of r.ingredients) {
const p = parseIngredient(line);
const key = normalizeName(p.name);
if (!map[key]) map[key] = { name: p.name, qty: null, unit: null, units: [], count: 0 };
if (p.qty != null && map[key].qty != null && map[key].unit === p.unit) {
map[key].qty += p.qty;
} else if (p.qty != null && map[key].qty == null) {
map[key].qty = p.qty; map[key].unit = p.unit;
} else {
map[key].units.push(line);
}
map[key].count++;
}
}
return Object.values(map).sort((a, b) => a.name.localeCompare(b.name, "fr"));
}
function normalizeName(n) {
return n.toLowerCase().replace(/\b(de |du |des |d')/g, "").replace(/\s+/g, " ").trim();
}
function renderIngredients() {
const el = document.getElementById("ingredientList");
const items = buildAggregated();
el.innerHTML = items.length === 0
? `<div class="empty">Coche des recettes pour générer ta liste.</div>`
: items.map((it, idx) => {
const de = /^(de |du |d')/i.test(it.name) ? " " : " de ";
const label = it.qty != null ? `${formatQty(it.qty, it.unit)}${de}${it.name}` : it.name;
const detail = it.units.length && it.qty != null ? it.units.join(" ; ") : "";
const key = "ing:" + idx;
const ck = checkedItems.includes(key);
return `<div class="ing-row ${ck ? "checked" : ""}" onclick="toggleCheck('${escapeAttr(key)}')">
<input type="checkbox" ${ck ? "checked" : ""} onclick="event.stopPropagation();toggleCheck('${escapeAttr(key)}')">
<img src="${ingredientImgUrl(it.name)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'di-ph',textContent:'🥕'}))">
<div style="flex:1">
<div class="ing-name">${escapeHtml(label)}</div>
${detail ? `<div class="ing-qty">dont ${escapeHtml(detail)}</div>` : ""}
</div>
</div>`;
}).join("");
}
function toggleCheck(key) {
const i = checkedItems.indexOf(key);
if (i === -1) checkedItems.push(key); else checkedItems.splice(i, 1);
save();
renderIngredients();
}
function clearChecked() {
checkedItems = [];
save();
renderIngredients();
}
function clearSelection() {
if (selection.length && !confirm("Tout retirer ?")) return;
selection = [];
checkedItems = [];
save();
renderRecipes();

function catFr(c) { return CATS_FR[c] || c; }
function areaFr(a) { return AREAS_FR[a] || a; }
function translate(name) {
const t = TRANSLATIONS[name];
if (t) return t;
return name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
}
function normalizeMeasure(m) {
return m.trim().replace(/\s+/g, " ");
}
function roundQty(v) {
if (v >= 100) return Math.round(v);
if (v >= 10) return Math.round(v * 2) / 2;
return Math.round(v * 4) / 4;
}
function mealToIngredients(meal, scale) {
scale = scale || 1;
const list = [];
for (let i = 1; i <= 20; i++) {
const ing = meal["strIngredient" + i];
const mes = meal["strMeasure" + i];
if (!ing || !ing.trim()) continue;
const t = translate(ing.trim());
const m0 = mes ? normalizeMeasure(mes) : "";
const skip = ["to serve", "dusting", "to taste", "as needed", "for garnish", "handful", "garnish"];
if (m0 && !skip.includes(m0.toLowerCase())) {
const unitMatch = m0.match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|kg|ml|cl|dl|l)\b/i);
if (unitMatch) {
const scaled = roundQty(parseFloat(unitMatch[1].replace(",", ".")) * scale);
list.push(scaled + " " + unitMatch[2].toLowerCase() + " de " + t);
} else {
const numMatch = m0.match(/^(\d+(?:[.,]\d+)?)(\D.*)$/);
if (numMatch) {
const scaled = roundQty(parseFloat(numMatch[1].replace(",", ".")) * scale);
list.push(scaled + numMatch[2] + " " + t);
} else {
list.push(m0 + " " + t);
}
}
} else {
list.push(t);
}
}
return list;
}

function normalizePriceKey(name) {

}
function lookupPrice(name) {
const k = normalizePriceKey(name);
if (PRICES[k] != null) return { rate: PRICES[k], known: true };
for (const p of DEFAULT_RATES) {
if (p[0].test(k)) return { rate: p[1], known: false };
}
return { rate: 3, known: false };
}
function estimateAmount(it) {
if (it.qty != null && it.unit === "g") return { amount: it.qty / 1000, basis: "kg" };
if (it.qty != null && it.unit === "l") return { amount: it.qty, basis: "L" };
if (it.qty != null && !it.unit) return { amount: it.qty, basis: "pc" };
const m = String(it.name).match(/(\d+(?:[.,]\d+)?)/);
if (m) { const n = parseFloat(m[1]); return n <= 20 ? { amount: n, basis: "pc" } : { amount: n / 1000, basis: "kg" }; }
return { amount: 1, basis: "pc" };
}
function estimateItemPrice(it, factor) {
const { rate } = lookupPrice(it.name);
const { amount, basis } = estimateAmount(it);
let price;
if (basis === "pc") {
const isMeat = /poulet|boeuf|bœuf|porc|agneau|veau|steak|jambon/i.test(it.name);
price = rate * amount * (isMeat ? 0.3 : 0.15);
} else {
price = rate * amount;
}
return Math.max(0.1, price * factor);
}
function computeBasketEstimate(storeFactor) {

items.forEach((it, idx) => {

const { known } = lookupPrice(it.name);
if (known) knownCount++;
const price = estimateItemPrice(it, storeFactor);
total += price;
rows.push({ name: it.name, price, known });
});
return { rows, total, knownCount, totalCount: rows.length, skipped };
}

h += `<div class="section-title" style="margin-top:4px">Ingrédients</div>`;
for (const line of r.ingredients) {
h += `<div class="detail-ing"><img src="${ingredientImgUrl(line)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'di-ph',textContent:'🥒'}))"><span>${escapeHtml(line)}</span></div>`;
}
if (r.instructions) {
h += `<div class="section-title">Recette</div>`;
h += `<div class="detail-instructions">${escapeHtml(translateInstructions(r.instructions))}</div>`;
}
h += `<div class="modal-actions"><button class="btn btn-secondary" onclick="closeDetail()">Fermer</button></div>`;
document.getElementById("detailContent").innerHTML = h;
document.getElementById("detailModalBg").classList.add("open");
}
function closeDetail() {
document.getElementById("detailModalBg").classList.remove("open");
}

function openServingsEditor(id) {
const r = recipes.find(x => x.id === id);
if (!r) return;
editingRecipeId = id;
editorServings = r.servings || 4;
document.getElementById("editorServingsVal").textContent = editorServings;
document.getElementById("servingsEditorTitle").textContent = r.name + " — pour combien ?";
document.getElementById("servingsModalBg").classList.add("open");
}
function closeServingsEditor() {
document.getElementById("servingsModalBg").classList.remove("open");
editingRecipeId = null;
}
function stepServings(d) {
editorServings = Math.max(1, Math.min(12, editorServings + d));
document.getElementById("editorServingsVal").textContent = editorServings;
}
function applyServings() {
const r = recipes.find(x => x.id === editingRecipeId);
if (!r) { closeServingsEditor(); return; }
const base = r.servings || 4;
if (editorServings !== base) {
r.ingredients = r.ingredients.map(line => scaleIngredientLine(line, editorServings / base));
r.servings = editorServings;
save();
}
renderRecipes();
closeServingsEditor();
}
function scaleIngredientLine(line, factor) {
const m = line.match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|kg|ml|cl|dl|l)?\b/i);
if (!m) return line;
const val = parseFloat(m[1].replace(",", ".")) * factor;
const scaled = roundQty(val) + (m[2] ? " " + m[2] : "");
return scaled + line.slice(m[0].length);
}

function openPriceModal() {
const items = buildAggregated();
if (items.length === 0) { alert("Coche des recettes d'abord !"); return; }
document.getElementById("priceStoreChoice").style.display = "";
document.getElementById("priceResult").style.display = "none";
let h = "";
const estimates = STORES.map(s => ({ s, est: computeBasketEstimate(s.factor) }));
estimates.sort((a, b) => a.est.total - b.est.total);
for (const { s, est } of estimates) {
h += `<button type="button" class="store-choice" onclick="chooseStore('${s.id}')">
<span class="st-emoji">${s.emoji}</span>
<span style="flex:1"><span>${s.name}</span><div class="st-sub">${s.sub}</div></span>
<span class="st-price">≈ ${est.total.toFixed(2)} €</span>
</button>`;
}
document.getElementById("storeChoices").innerHTML = h;
document.getElementById("priceModalBg").classList.add("open");
}
function closePriceModal() {
document.getElementById("priceModalBg").classList.remove("open");
}
function chooseStore(id) {
const s = STORES.find(x => x.id === id);
if (!s) return;
const est = computeBasketEstimate(s.factor);
document.getElementById("priceStoreChoice").style.display = "none";
document.getElementById("priceResult").style.display = "";
let h = `<div class="section-title" style="margin-top:0">${s.emoji} ${s.name} — détail du panier</div>`;
for (const r of est.rows) {
h += `<div class="price-row"><span class="pr-name">${escapeHtml(r.name)}${r.known ? "" : " ~"}</span><span class="pr-val">${r.price.toFixed(2)} €</span></div>`;
}
const lo = est.total * 0.85, hi = est.total * 1.15;
h += `<div class="price-total">
<div style="font-size:12px;color:var(--muted)">Total estimé (${est.knownCount}/${est.totalCount} produits à prix connu)${est.skipped ? " · " + est.skipped + " déjà acheté(s) exclu(s)" : ""}</div>
<div class="pt-amount">${est.total.toFixed(2)} €</div>
<div style="font-size:11px;color:var(--muted)">Fourchette : ${lo.toFixed(2)} – ${hi.toFixed(2)} €</div>
</div>`;
h += `<button type="button" class="back-btn" onclick="backToStores()">← Changer de magasin</button>`;
document.getElementById("priceResult").innerHTML = h;
}
function backToStores() {
document.getElementById("priceResult").style.display = "none";
document.getElementById("priceStoreChoice").style.display = "";
}

renderRecipes();</script>
</body>
</html>
